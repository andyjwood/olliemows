(() => {

    rand: [{ t: 'tree', n: 14, r: 70 }, { t: 'hay', n: 8, r: 60, rad: 26 }] }

/* ================= Save ================= */
let SAVE = { stars: {}, cash: 0, seen: false, mute: false };
try { Object.assign(SAVE, JSON.parse(localStorage.getItem('olliemows_v1')) || {}); } catch (e) {}
const persist = () => { try { localStorage.setItem('olliemows_v1', JSON.stringify(SAVE)); } catch (e) {} };

/* ================= Canvas / state ================= */
let W = 0, H = 0, dpr = 1, baseZoom = 1;
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); baseZoom = clamp(Math.min(W, H) / 430, .7, 1.5); }
addEventListener('resize', resize); resize();

let state = 'menu', L = null, P = null, jobIdx = 0, pops = [], parts = [], last = 0, hudT = 0, miniT = 0, townT = 0;
let zoom = 1, shake = 0;
const cam = { x: 0, y: 0 };
const ptr = { x: 0, y: 0, active: false, down: false, halted: true, sx: 0, sy: 0, st: 0, moved: false };

/* ================= Audio ================= */
let AC = null, eng = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type = 'sine', v = .12, delay = 0, f2 = 0) {
  if (!AC || SAVE.mute) return;
  const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f, s); if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
  g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v, s + .015); g.gain.exponentialRampToValueAtTime(.0001, s + d);
  o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + d + .03);
}
function sfx(k) {
  if (k === 'rock') { tone(180, .25, 'square', .12, 0, 60); tone(900, .08, 'triangle', .08); }
  else if (k === 'stick') { tone(700, .08, 'square', .09); tone(500, .1, 'square', .07, .05); }
  else if (k === 'swap') { tone(500, .08, 'triangle', .1); tone(700, .1, 'triangle', .1, .07); }
  else if (k === 'win') { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .14, i * .12)); }
  else if (k === 'start') { tone(330, .1, 'triangle'); tone(440, .12, 'triangle', .12, .1); }
}
function engineStart() {
  if (!AC || eng) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 700; o.type = 'sawtooth'; o.frequency.value = 60; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(AC.destination); o.start(); eng = { o, g };
  } catch (e) { eng = null; }
}
function engineSet(tool, ratio, on) {
  if (!eng) return; const T = TOOLS[tool];
  eng.o.type = T.eType; eng.o.frequency.setTargetAtTime(T.eng[0] + (T.eng[1] - T.eng[0]) * ratio, AC.currentTime, .08);
  eng.g.gain.setTargetAtTime(on && !SAVE.mute ? (tool === 'trim' ? .022 : .04) : 0, AC.currentTime, .12);
}

/* ================= Level building ================= */
function bbox(o) {
  switch (o.t) {
    case 'tree': return [o.x - 24, o.y - 24, o.x + 24, o.y + 24];
    case 'hay': case 'silo': case 'dirt': return [o.x - o.r, o.y - o.r, o.x + o.r, o.y + o.r];
    case 'pond': return [o.x - o.rx, o.y - o.ry, o.x + o.rx, o.y + o.ry];
    default: return [o.x, o.y, o.x + o.w, o.y + o.h];
  }
}
function buildLevel(i) {
  const def = LEVELS[i], rng = mulberry(def.seed), W0 = def.w, H0 = def.h, cols = W0 / CELL, rows = H0 / CELL;
  const objs = def.objs.map(o => Object.assign({}, o));
  const boxes = objs.map(bbox);
  (def.rand || []).forEach(r => {
    let n = 0, tries = 0;
    while (n < r.n && tries < r.n * 120) {
      tries++;
      const x = 70 + rng() * (W0 - 140), y = 120 + rng() * (H0 - 190);
      if (Math.hypot(x - def.start[0], y - def.start[1]) < 200) continue;
      let bad = false;
      for (const b of boxes) if (x > b[0] - r.r && x < b[2] + r.r && y > b[1] - r.r && y < b[3] + r.r) { bad = true; break; }
      if (bad) continue;
      const o = { t: r.t, x, y, r: r.rad || 0 }; objs.push(o); boxes.push(bbox(o)); n++;
    }
  });
  const st = new Uint8Array(cols * rows).fill(1), solid = new Uint8Array(cols * rows), tm = new Float32Array(cols * rows), edge = new Uint8Array(cols * rows);
  const markRect = (x, y, w, h, sol) => {
    for (let cy = Math.max(0, Math.floor(y / CELL)); cy < Math.min(rows, Math.ceil((y + h) / CELL)); cy++)
      for (let cx = Math.max(0, Math.floor(x / CELL)); cx < Math.min(cols, Math.ceil((x + w) / CELL)); cx++) { const k = cy * cols + cx; st[k] = 0; if (sol) solid[k] = 1; }
  };
  const markEll = (x, y, rx, ry, sol) => {
    for (let cy = Math.max(0, Math.floor((y - ry) / CELL)); cy < Math.min(rows, Math.ceil((y + ry) / CELL)); cy++)
      for (let cx = Math.max(0, Math.floor((x - rx) / CELL)); cx < Math.min(cols, Math.ceil((x + rx) / CELL)); cx++) {
        const dx = ((cx + .5) * CELL - x) / rx, dy = ((cy + .5) * CELL - y) / ry;
        if (dx * dx + dy * dy <= 1) { const k = cy * cols + cx; st[k] = 0; if (sol) solid[k] = 1; }
      }
  };
  markRect(0, 0, W0, 16, 1); markRect(0, H0 - 16, W0, 16, 1); markRect(0, 0, 16, H0, 1); markRect(W0 - 16, 0, 16, H0, 1);
  for (const o of objs) {
    switch (o.t) {
      case 'path': markRect(o.x, o.y, o.w, o.h, 0); break;
      case 'dirt': markEll(o.x, o.y, o.r, o.r, 0); break;
      case 'lines': break;
      case 'pond': markEll(o.x, o.y, o.rx, o.ry, 1); break;
      case 'tree': markEll(o.x, o.y - 6, 11, 11, 1); break;
      case 'hay': case 'silo': markEll(o.x, o.y, o.r, o.r, 1); break;
      default: markRect(o.x, o.y, o.w, o.h, 1);
    }
  }
  let total = 0, edgeTotal = 0;
  for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
    const k = cy * cols + cx; if (st[k] !== 1) continue; total++;
    let near = false;
    for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) {
      const x = cx + dx, y = cy + dy; if (x < 0 || y < 0 || x >= cols || y >= rows) continue;

  const house = (x, y, wall, roof) => o.push({ t: 'building', x, y, w: 190, h: 120, wall, roof, doors: 1, win: 2, yb: y + 120 });
  [[90, 90, '#f3e3c3', '#b5533c'], [330, 90, '#cfe3f2', '#4b6fa5'], [620, 90, '#f6d6d6', '#7a4b6a'], [900, 90, '#e6f0c8', '#6b7a3a'],
    [90, 470, '#f9e8b8', '#9a5b2c'], [330, 470, '#d9d2f2', '#5a4b8a'], [620, 470, '#cfeee6', '#3a7a6a'], [900, 470, '#f3e3c3', '#b5533c']].forEach(a => house(...a));
  [[40, 280], [260, 300], [520, 290], [820, 300], [1110, 280], [40, 650], [300, 660], [560, 650], [840, 660], [1120, 650]].forEach(([x, y], i) => o.push({ t: 'tree', x, y, s: .9, yb: y }));
  o.push({ t: 'car', x: 560, y: 400, w: 90, h: 46, c: '#d8453c', yb: 446 }, { t: 'car', x: 250, y: 560, w: 46, h: 90, c: '#3f7fd0', yb: 650 });
  return o;
})();
function renderTown(dt) {
  townT += dt; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const z = Math.max(W / 760, H / 760, .9);
  const cx = 600 + Math.sin(townT * .12) * 160, cy = 420 + Math.cos(townT * .09) * 40;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - cx * z), dpr * (H / 2 - cy * z));
  ctx.fillStyle = '#7fc65a'; ctx.fillRect(-300, -300, 2000, 1700);
  for (let y = -300; y < 1400; y += 24) for (let x = -300; x < 1700; x += 24) { const v = hash(x, y); if (v < .2) { ctx.fillStyle = 'rgba(40,120,40,.12)'; ctx.fillRect(x, y, 24, 24); } }
  ctx.fillStyle = '#6e7378'; ctx.fillRect(-300, 250, 2000, 70); ctx.fillRect(-300, 640, 2000, 70);
  ctx.fillStyle = '#d9d2c0'; ctx.fillRect(-300, 244, 2000, 6); ctx.fillRect(-300, 320, 2000, 6); ctx.fillRect(-300, 634, 2000, 6); ctx.fillRect(-300, 710, 2000, 6);
  ctx.fillStyle = '#f2d85a'; for (let x = -300; x < 1700; x += 60) { ctx.fillRect(x, 283, 30, 4); ctx.fillRect(x, 673, 30, 4); }
  ctx.fillStyle = '#4aa8e0'; ctx.beginPath(); ctx.ellipse(1280, 520, 120, 80, 0, 0, TAU); ctx.fill();
  const items = TOWN.map(o => ({ y: o.yb, f: () => drawObj(o) }));
  const dp = { x: 560 + Math.sin(townT * .5) * 120, y: 400 + 0, hd: Math.cos(townT * .5) > 0 ? 0 : Math.PI, speed: 150, phase: townT * 8, stall: 0, flip: 1, tool: 'push' };
  items.push({ y: dp.y, f: () => drawActor(dp, townT) }); items.sort((a, b) => a.y - b.y); items.forEach(it => it.f());
}

/* ================= Menus ================= */
const card = $('#card');
function showMenu() {
  state = 'menu'; engineStop(); $('#hud').hidden = true; L = null;
  const rows = LEVELS.map((l, i) => {
    const s = SAVE.stars[l.id] || 0;
    return `<button class="job" data-i="${i}"><span class="je">${l.emoji}</span><span class="jn"><b>${l.name}</b><small>${l.desc} · $${l.pay}</small></span><span class="js">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</span></button>`;
  }).join('');
  card.innerHTML = `<h1>Ollie Mows<br>the Lawn</h1><div class="sub">💰 $${SAVE.cash} earned</div>
    <div class="jobs">${rows}</div><button class="link" id="how">How to play</button>`;
  $('#ov').hidden = false;
  card.querySelectorAll('.job').forEach(b => b.onclick = () => { initAudio(); showTools(+b.dataset.i); });
  $('#how').onclick = showHow;
}
function showHow() {
  card.innerHTML = `<h2>How to play</h2><ul>
    <li>👆 <b>Drag</b> your finger (or mouse) to steer Ollie. Keep it <b>far from him</b> to go fast. <b>Tap</b> anywhere to stop, and tap again to go.</li>
    <li>🌱 Mow every patch of <b>tall grass</b>. Check the little map to see what's left.</li>
    <li>🔁 Try not to mow the <b>same spot twice</b>. Neat stripes earn more.</li>
    <li>🪨 Dodge <b>rocks</b> and 🪵 <b>sticks</b>. Hitting them costs repair money.</li>
    <li>✂️ Mowers can't reach right up to fences and walls. Switch to the <b>Trimmer</b> to do the <b>edges</b>.</li>
    <li>🚜 The riding mower is fast and wide, but it turns slowly. Great for big fields.</li>
    <li>✓ Tap <b>Done</b> when you're finished to get paid.</li></ul>
    <button class="big" id="ok">Got it!</button>`;
  $('#ok').onclick = () => { SAVE.seen = true; persist(); showMenu(); };
}
function showTools(i) {
  const l = LEVELS[i];
  const tools = Object.keys(TOOLS).map(k => {
    const T = TOOLS[k], d = k === 'trim' ? 'Slow and skinny, but reaches every edge.' : k === 'push' ? 'A good all-rounder. Medium speed and width.' : 'Fast and wide, but it turns slowly and can\'t reach edges.';
    return `<button class="tool" data-t="${k}"><b>${T.emoji} ${T.label}</b><small>${d}</small>${l.tool === k ? '<em>Good pick for this job!</em>' : ''}</button>`;
  }).join('');
  card.innerHTML = `<h2>${l.emoji} ${l.name}</h2><div class="sub">Pay up to $${l.pay}. You can switch tools any time.</div><div class="tools">${tools}</div><button class="big alt" id="back">Back</button>`;
  card.querySelectorAll('.tool').forEach(b => b.onclick = () => startJob(i, b.dataset.t));
  $('#back').onclick = showMenu;
}
function pauseMenu() {
  if (state !== 'play') return; state = 'pause'; ptr.active = false; ptr.down = false; ptr.halted = true; engineSet(P.tool, 0, false);
  card.innerHTML = `<h2>Paused</h2><button class="big" id="res">Keep mowing</button><button class="big alt" id="snd">${SAVE.mute ? '🔇 Sound off' : '🔊 Sound on'}</button><button class="big alt" id="quit">Leave job</button>`;
  $('#ov').hidden = false;
  $('#res').onclick = () => { $('#ov').hidden = true; state = 'play'; };
  $('#snd').onclick = () => { SAVE.mute = !SAVE.mute; persist(); $('#snd').textContent = SAVE.mute ? '🔇 Sound off' : '🔊 Sound on'; };
  $('#quit').onclick = showMenu;
}
function finishJob() {
  if (state !== 'play') return; state = 'done'; engineStop(); ptr.active = false;
  const lawn = L.cut / L.total, edge = L.edgeCut / Math.max(1, L.edgeTotal), ovl = L.ovl / L.total, hits = L.rockHits + L.stickHits;
  let stars = 0;
  if (lawn >= .7) stars = 1;
  if (lawn >= .9 && edge >= .6 && ovl < .35) stars = 2;
  if (lawn >= .97 && edge >= .9 && ovl < .25 && hits <= 2) stars = 3;
  const gross = Math.round(L.def.pay * (.6 * lawn + .4 * edge) * (1 - Math.min(.4, ovl * .8)));
  const pay = Math.max(0, gross - L.repairs);
  const bestPrev = SAVE.stars[L.def.id] || 0;
  if (stars > bestPrev) SAVE.stars[L.def.id] = stars;
  SAVE.cash += pay; persist(); sfx('win');
  const t = Math.floor(L.time), idx = L.i, next = idx + 1 < LEVELS.length;
  card.innerHTML = `<h2>${stars === 3 ? '🌟 Perfect job!' : stars >= 1 ? 'Nice work!' : 'Job done'}</h2>
    <div class="stars">${'★'.repeat(stars)}<i>${'★'.repeat(3 - stars)}</i></div>
    <div class="rows">
      <div><span>🌱 Lawn mowed</span><b>${Math.round(lawn * 100)}%</b></div>
      <div><span>✂️ Edges trimmed</span><b>${Math.round(edge * 100)}%</b></div>
      <div><span>🔁 Re-mowed spots</span><b>${Math.round(ovl * 100)}%</b></div>
      <div><span>🪨 Rocks &amp; 🪵 sticks hit</span><b>${hits}</b></div>
      <div><span>⏱ Time</span><b>${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}</b></div>
      <div><span>🔧 Repairs</span><b>-$${L.repairs}</b></div></div>
    <div class="pay">You earned $${pay}</div>
    ${next ? '<button class="big" id="nx">Next job</button>' : ''}<button class="big ${next ? 'alt' : ''}" id="rt">Try this job again</button><button class="big alt" id="tw">Back to town</button>`;
  $('#ov').hidden = false; $('#hud').hidden = true;
  if (next) $('#nx').onclick = () => showTools(idx + 1);
  $('#rt').onclick = () => showTools(idx); $('#tw').onclick = showMenu;
}

/* ================= Input / loop ================= */
function setPtr(e) { ptr.x = e.clientX; ptr.y = e.clientY; }
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; initAudio(); e.preventDefault(); setPtr(e); ptr.down = true; ptr.moved = false; ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.st = performance.now(); ptr.active = true; });
addEventListener('pointermove', e => {
  if (state !== 'play' || !ptr.down) return; e.preventDefault(); setPtr(e);
  if (!ptr.moved && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 12) { ptr.moved = true; ptr.halted = false; }
}, { passive: false });
function ptrEnd(e) {
  if (!ptr.down) return; ptr.down = false;
  if (state !== 'play') return;
  if (!ptr.moved && performance.now() - ptr.st < 350) { ptr.halted = !ptr.halted; if (!ptr.halted) { setPtr(e); ptr.active = true; } }
}
addEventListener('pointerup', ptrEnd);
addEventListener('pointercancel', () => { ptr.down = false; });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.querySelectorAll('.tb[data-tool]').forEach(b => b.addEventListener('click', () => switchTool(b.dataset.tool)));
$('#done').addEventListener('click', () => { if (state === 'play') finishJob(); });
$('#menu').addEventListener('click', pauseMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pauseMenu(); });

function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (state === 'play') {
    updatePlay(dt);
    if (state === 'play') {
      cam.x += (P.x - cam.x) * Math.min(1, dt * 8); cam.y += (P.y - cam.y) * Math.min(1, dt * 8);
      zoom += (baseZoom * TOOLS[P.tool].zoom - zoom) * Math.min(1, dt * 4);
      hudUpdate(false); miniUpdate(false);
    }
  }
  if (shake > 0) shake = Math.max(0, shake - dt);
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].age += dt; if (pops[i].age > 1.3) pops.splice(i, 1); }
  if (L && (state === 'play' || state === 'pause' || state === 'done')) renderGame(ts); else renderTown(dt);
  requestAnimationFrame(frame);
}
showMenu(); if (!SAVE.seen) showHow();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
